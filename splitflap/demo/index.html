<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>splitflap — harbor board</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 1.5rem;
        background: radial-gradient(120% 90% at 50% 0%, #1d2530 0%, #0a0c10 60%);
        color: #cfd6e4;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        padding: 2rem 1rem;
        box-sizing: border-box;
      }
      .case {
        padding: 1.25rem;
        border-radius: 14px;
        background: #05070a;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        display: grid;
        gap: 0.9rem;
        justify-items: center;
        max-width: 100%;
        overflow-x: auto;
      }
      .strip { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; justify-content: center; }
      split-flap { font-size: clamp(13px, 3.1vw, 26px); }
      split-flap[cols="6"] { --flap-fg: #ffd479; }
      .legend { font-size: 0.75rem; letter-spacing: 0.14em; color: #6d7889; text-transform: uppercase; }
      button {
        font: inherit;
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: #161b24;
        color: #cfd6e4;
        border: 1px solid #2a3240;
        border-radius: 999px;
        padding: 0.5rem 1.1rem;
        cursor: pointer;
      }
      button:hover { border-color: #4a586e; }
    </style>
  </head>
  <body>
    <div class="case">
      <div class="strip">
        <split-flap id="header" rows="1" cols="17" stagger="1" fps="16"></split-flap>
        <split-flap id="clock" rows="1" cols="6" stagger="1" fps="16"></split-flap>
      </div>
      <split-flap id="board" rows="6" cols="32" stagger="1" fps="18"></split-flap>
      <div class="legend">time · route · destination · status</div>
    </div>
    <button id="sound" type="button">clack: off</button>

    <script type="module">
      import '../src/element.js';
      import { start } from './app.js';

      const board = document.querySelector('#board');
      start({
        board,
        clock: document.querySelector('#clock'),
        header: document.querySelector('#header'),
      });

      const toggle = document.querySelector('#sound');
      toggle.addEventListener('click', () => {
        const on = board.toggleAttribute('sound');
        toggle.textContent = `clack: ${on ? 'on' : 'off'}`;
      });
    </script>
  </body>
</html>
