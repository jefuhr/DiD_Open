<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#001d41" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ferry Board" />
    <meta name="robots" content="noindex" />
    <title>NYC Ferry Staff Board · Map</title>
    <link rel="icon" href="/assets/app-icon.png?v=88" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/app-icon-180.png?v=88" />
    <!-- The board's own stylesheet, loaded first for design system variables, typography, and themes. -->
    <link rel="stylesheet" href="/styles.css?v=88" />
    <link rel="stylesheet" href="/assets/map.css?v=3" />
    <!-- Theme bootstrap to prevent initial flash of unstyled/wrong theme -->
    <script>
      try {
        var saved = localStorage.getItem("nyc-ferry-did-theme");
        var known = ["night", "hello-kitty", "cinnamoroll", "pompompurin", "kuromi", "windows-xp", "hacker", "burger-king"];
        document.documentElement.dataset.theme = known.indexOf(saved) === -1 ? "nyc-ferry" : saved;
      } catch (error) {
        document.documentElement.dataset.theme = "nyc-ferry";
      }
      document.documentElement.dataset.surface =
        new URL("./", location).pathname === "/" ? "kiosk" : "app";
    </script>
  </head>
  <body class="map-body">
    <!-- Floating Header -->
    <div class="board-heading map-heading">
      <a class="menu-button back-button" href="." aria-label="Back to the board" title="Back to the board">
        <svg class="back-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M15 5 8 12l7 7" />
        </svg>
      </a>
      <h1>On the water</h1>
      <div class="board-state">
        <div class="route-count" id="boatCount">Loading…</div>
        <div class="status" id="mapStatus"><i></i><span id="mapStatusText">Live</span></div>
      </div>
    </div>

    <!-- Quick Route Filter Bar -->
    <div class="route-filter-bar" id="routeFilterBar" aria-label="Route filter"></div>

    <!-- Full-Bleed Map Canvas Frame -->
    <div class="map-frame" id="mapFrame">
      <svg id="chart" tabindex="0" role="img" aria-labelledby="chartTitle"></svg>
      <div class="map-tools">
        <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
        <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
        <button type="button" id="zoomFit" aria-label="Show the whole harbor">Fit</button>
      </div>
      <p class="map-message" id="mapMessage" hidden></p>
      <p class="map-credit">© OpenStreetMap · OpenSeaMap</p>
    </div>

    <!-- Floating Interactive Cards -->
    <div class="vessel-card" id="vesselCard" aria-live="polite" hidden></div>
    <div class="dock-card" id="dockCard" aria-live="polite" hidden></div>

    <!-- Modern Draggable Bottom Sheet -->
    <div class="bottom-sheet" id="bottomSheet" data-state="half">
      <div class="sheet-handle-zone" id="sheetHandle" role="button" tabindex="0" aria-label="Toggle vessel list">
        <div class="sheet-handle-bar"></div>
      </div>
      <div class="sheet-header">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" id="boatSearch" class="search-input" placeholder="Search vessels, hull # or stop…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        </div>
      </div>
      <div class="sheet-scrollable">
        <p class="legend" id="legend"></p>
        <ol class="boats" id="boats"></ol>
      </div>
    </div>

    <script src="/assets/map.js?v=3"></script>
  </body>
</html>
