<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#001d41" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ferry Board" />
    <meta name="robots" content="noindex" />
    <title>NYC Ferry Staff Board · Map</title>
    <link rel="icon" href="/assets/app-icon.png?v=86" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/app-icon-180.png?v=86" />
    <!-- The board's own stylesheet, not a copy of it. Every variable, font and theme this page
         needs already lives there, so the map is dressed by whatever the board is wearing rather
         than by a second palette that drifts away from it. map.css only adds what a map needs. -->
    <link rel="stylesheet" href="/styles.css?v=86" />
    <link rel="stylesheet" href="/assets/map.css?v=2" />
    <!-- Same bootstrap as the board, for the same reason: the theme has to be on the document
         before the first paint, or a saved one arrives as a visible flash of the default. -->
    <script>
      try {
        var saved = localStorage.getItem("nyc-ferry-did-theme");
        var known = ["night", "hello-kitty", "cinnamoroll", "pompompurin", "kuromi", "windows-xp", "hacker", "burger-king"];
        document.documentElement.dataset.theme = known.indexOf(saved) === -1 ? "nyc-ferry" : saved;
      } catch (error) {
        document.documentElement.dataset.theme = "nyc-ferry";
      }
      // "./" is this page's own directory — "/" on a kiosk, "/ferryTimesMobile/" behind the proxy.
      // The board reads the same expression against its own URL, so both pages agree about which
      // surface they are on and size their shared chrome the same way.
      document.documentElement.dataset.surface =
        new URL("./", location).pathname === "/" ? "kiosk" : "app";
    </script>
  </head>
  <body class="map-body">
    <div class="board-heading map-heading">
      <!-- "." is the board's own directory: the site root on a kiosk, /ferryTimesMobile/ behind the
           proxy. The same resolution the map button used to get here. -->
      <a class="menu-button back-button" href="." aria-label="Back to the board" title="Back to the board">
        <svg class="back-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M15 5 8 12l7 7" />
        </svg>
      </a>
      <h1>On the water</h1>
      <div class="board-state">
        <div class="route-count" id="boatCount">Loading…</div>
        <div class="status" id="mapStatus"><i></i><span id="mapStatusText">Live</span></div>
      </div>
    </div>

    <div class="map-frame">
      <svg id="chart" tabindex="0" role="img" aria-labelledby="chartTitle"></svg>
      <div class="map-tools">
        <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
        <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
        <button type="button" id="zoomFit" aria-label="Show the whole harbor">Fit</button>
      </div>
      <p class="map-message" id="mapMessage" hidden></p>
      <!-- Required by the licences the tiles are published under, not decoration: OpenStreetMap
           data is ODbL and asks to be credited wherever it is shown. -->
      <p class="map-credit">© OpenStreetMap · OpenSeaMap</p>
    </div>

    <p class="legend" id="legend"></p>
    <ol class="boats" id="boats"></ol>
    <script src="/assets/map.js?v=2"></script>
  </body>
</html>
