<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#001d41" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ferry Board" />
    <title>NYC Ferry Staff Board</title>
    <link rel="icon" href="/assets/kiosk-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=38" />
  </head>
  <body>
    <main class="screen" id="screen">
      <div class="content">
        <section class="board" aria-labelledby="landingName">
          <div class="board-heading">
            <button type="button" class="menu-button" id="menuButton" aria-expanded="false" aria-controls="landingMenu">
              <span class="menu-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Choose landing</span>
            </button>
            <h1 id="landingName">NYC Ferry</h1>
            <div class="board-state">
              <div class="route-count" id="routeCount">Loading routes…</div>
              <div class="status" id="dataStatus"><i></i><span>Local schedule</span></div>
              <div class="clock"><time id="clockTime">--:--</time><span id="clockDate">Loading schedule…</span></div>
            </div>
          </div>
          <div class="column-head" id="columnHead" hidden><span>Route</span><span>Direction</span><span>Next departures</span></div>
          <div class="departures" id="departures" aria-live="polite"></div>
        </section>
      </div>
      <div class="landing-menu" id="landingMenu" hidden>
        <div class="landing-menu-scrim" id="landingMenuScrim"></div>
        <nav class="landing-menu-panel" id="landingMenuPanel" aria-label="Choose landing">
          <div class="landing-menu-head">
            <strong>Landing</strong>
            <button type="button" class="landing-menu-close" id="landingMenuClose">Done</button>
          </div>
          <div class="sort-toggle" role="group" aria-label="Sort departures">
            <button type="button" class="sort-option" id="sortByRoute" data-sort="route" aria-pressed="false">Route</button>
            <button type="button" class="sort-option" id="sortByTime" data-sort="time" aria-pressed="true">Departure time</button>
          </div>
          <ul class="landing-list" id="landingList"></ul>
        </nav>
      </div>
      <section class="manual-override" id="manualOverride" hidden aria-live="assertive" aria-atomic="true">
        <div class="manual-override-box" id="manualOverrideBox" data-size="short">
          <span class="manual-override-label">Service notice</span>
          <p id="manualOverrideMessage"></p>
          <small id="manualOverrideUpdated"></small>
        </div>
      </section>
      <section class="service-alert-bar loading" id="serviceAlerts" aria-live="polite" aria-atomic="true">
        <svg class="service-alert-icon" width="48" height="48" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path d="M16 3 30 28H2L16 3Z" />
          <path d="M16 11v8m0 4v1" />
        </svg>
        <div class="service-alert-copy">
          <div class="service-alert-heading">
            <strong>Service alerts</strong>
            <small id="serviceAlertFreshness">Realtime GTFS service updates</small>
          </div>
          <span id="serviceAlertSummary">Checking NYC Ferry service…</span>
        </div>
        <span class="service-alert-count" id="serviceAlertCount" hidden></span>
      </section>
    </main>
    <script type="module" src="/app.js?v=38"></script>
  </body>
</html>
