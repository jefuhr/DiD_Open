<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#001d41" />
    <title>NYC Ferry Departures</title>
    <link rel="icon" href="/assets/kiosk-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=12" />
  </head>
  <body>
    <main class="screen">
      <header class="header">
        <div class="brand"><img src="/assets/nyc-ferry-logo.png" alt="NYC Ferry" /><span>LIVE DEPARTURES</span></div>
        <div class="landing"><span>DEPARTING FROM</span><h1 id="landingName">NYC Ferry</h1></div>
        <div class="clock"><time id="clockTime">--:--</time><span id="clockDate">Loading schedule…</span></div>
      </header>
      <div class="content">
        <section class="board" aria-labelledby="boardTitle">
          <div class="board-heading"><div><span class="eyebrow">ALL ROUTES · ALL DIRECTIONS</span><h2 id="boardTitle">Next departures</h2></div><div class="board-state"><div class="slide-status" id="slideStatus">Routes 1–4</div><div class="status" id="dataStatus"><i></i><span>Local schedule</span></div></div></div>
          <div class="column-head"><span>Route</span><span>Direction</span><span>Next four departures · boat</span></div>
          <div class="departures" id="departures" aria-live="polite"></div>
        </section>
        <aside class="ferry-mart" aria-label="Ferry Mart promotion">
          <img src="/assets/ad.jpg" alt="Ferry Mart — check out the menu on the NYC Ferry app" />
        </aside>
      </div>
      <section class="service-alert-bar loading" id="serviceAlerts" aria-live="polite" aria-atomic="true">
        <svg class="service-alert-icon" width="48" height="48" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path d="M16 3 30 28H2L16 3Z" />
          <path d="M16 11v8m0 4v1" />
        </svg>
        <span class="service-alert-copy">
          <strong>Service alerts</strong>
          <span id="serviceAlertSummary">Checking NYC Ferry service…</span>
          <small id="serviceAlertFreshness">Realtime GTFS service updates</small>
        </span>
        <span class="service-alert-count" id="serviceAlertCount" hidden></span>
      </section>
    </main>
    <script type="module" src="/app.js?v=12"></script>
  </body>
</html>
