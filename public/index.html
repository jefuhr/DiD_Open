<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#001d41" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ferry Board" />
    <title>NYC Ferry Staff Board</title>
    <link rel="icon" href="/assets/kiosk-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=56" />
  </head>
  <body>
    <main class="screen" id="screen">
      <div class="content">
        <section class="board" aria-labelledby="landingName">
          <div class="board-heading">
            <button type="button" class="menu-button" id="menuButton" aria-expanded="false" aria-controls="landingMenu">
              <span class="menu-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Choose landing</span>
            </button>
            <h1 id="landingName">NYC Ferry</h1>
            <button type="button" class="nearest-button" id="nearestButton" data-state="idle">
              <svg class="nearest-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 1v3m0 16v3M1 12h3m16 0h3" />
              </svg>
              <span class="nearest-label" id="nearestLabel">Nearest</span>
            </button>
            <div class="board-state">
              <div class="route-count" id="routeCount">Loading routes…</div>
              <div class="status" id="dataStatus"><i></i><span>Local schedule</span></div>
              <div class="clock"><time id="clockTime">--:--</time><span id="clockDate">Loading schedule…</span></div>
            </div>
          </div>
          <div class="column-head" id="columnHead" hidden><span>Route</span><span>Direction</span><span>Next departures</span></div>
          <div class="departures" id="departures" aria-live="polite"></div>
          <!-- Below the list, not above it: the question "what about tomorrow?" is the one you have
               after you have read today's boats and run out of them. The clock format sits beside
               it because both are about how the board is read rather than what it says. -->
          <div class="board-footer">
            <button type="button" class="filter-button" id="filterButton" aria-expanded="false" aria-controls="filterMenu" aria-label="Filter operators">
              <svg class="filter-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 5h18l-7 8v6l-4 2v-8Z" />
              </svg>
              <span class="filter-count" id="filterCount" hidden></span>
            </button>
            <div class="date-bar" id="dateBar" data-state="today">
              <button type="button" class="date-step" id="datePrev" aria-label="Previous day">‹</button>
              <button type="button" class="date-current" id="dateCurrent" aria-label="Showing today's schedule">Today</button>
              <button type="button" class="date-step" id="dateNext" aria-label="Next day">›</button>
            </div>
            <button type="button" class="clock-toggle" id="clockToggle" aria-pressed="false">24 h</button>
          </div>
        </section>
      </div>
      <div class="landing-menu" id="landingMenu" hidden>
        <div class="landing-menu-scrim" id="landingMenuScrim"></div>
        <nav class="landing-menu-panel" id="landingMenuPanel" aria-label="Choose landing">
          <div class="landing-menu-head">
            <strong>Landing</strong>
            <button type="button" class="landing-menu-close" id="landingMenuClose">Done</button>
          </div>
          <div class="sort-toggle" role="group" aria-label="Sort departures">
            <button type="button" class="sort-option" id="sortByRoute" data-sort="route" aria-pressed="false">Route</button>
            <button type="button" class="sort-option" id="sortByTime" data-sort="time" aria-pressed="true">Departure time</button>
          </div>
          <ul class="landing-list" id="landingList"></ul>
        </nav>
      </div>
      <!-- Anchored to the footer rather than the landing drawer: hiding an operator is something you
           do while looking at the board it changes, and the answer has to be visible behind it. -->
      <div class="filter-menu" id="filterMenu" hidden>
        <div class="filter-menu-scrim" id="filterMenuScrim"></div>
        <div class="filter-menu-panel" id="filterMenuPanel" role="dialog" aria-modal="true" aria-label="Filter operators">
          <div class="filter-menu-head">
            <strong>Operators</strong>
            <button type="button" class="filter-menu-close" id="filterMenuClose">Done</button>
          </div>
          <ul class="filter-list" id="filterList"></ul>
          <button type="button" class="filter-reset" id="filterReset">Show all</button>
        </div>
      </div>
      <section class="manual-override" id="manualOverride" hidden aria-live="assertive" aria-atomic="true">
        <div class="manual-override-box" id="manualOverrideBox" data-size="short">
          <span class="manual-override-label">Service notice</span>
          <p id="manualOverrideMessage"></p>
          <small id="manualOverrideUpdated"></small>
        </div>
      </section>
      <section class="service-alert-bar loading" id="serviceAlerts" aria-live="polite" aria-atomic="true">
        <svg class="service-alert-icon" width="48" height="48" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path d="M16 3 30 28H2L16 3Z" />
          <path d="M16 11v8m0 4v1" />
        </svg>
        <div class="service-alert-copy">
          <div class="service-alert-heading">
            <strong>Service alerts</strong>
            <small id="serviceAlertFreshness">Realtime GTFS service updates</small>
          </div>
          <span id="serviceAlertSummary">Checking NYC Ferry service…</span>
        </div>
        <span class="service-alert-count" id="serviceAlertCount" hidden></span>
      </section>
    </main>
    <script type="module" src="/app.js?v=56"></script>
  </body>
</html>
