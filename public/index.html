<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#001d41" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ferry Board" />
    <title>NYC Ferry Staff Board</title>
    <link rel="icon" href="/assets/app-icon.png?v=72" type="image/png" />
    <!-- iOS reads this one specifically when the board is added to a home screen, and shows a
         screenshot of the page instead of an icon without it. 180px is the size it asks for. -->
    <link rel="apple-touch-icon" href="/assets/app-icon-180.png?v=72" />
    <!-- Android has no equivalent meta tags: name, standalone launch, splash screen and icons all
         come from the manifest, which is why the board installs as a bare shortcut without it.
         It lives under /assets/ because that is a path the deployment's proxy forwards to this
         server — a manifest at the site root is served by the landing page, not by the board. -->
    <link rel="manifest" href="/assets/site.webmanifest?v=72" />
    <link rel="stylesheet" href="/styles.css?v=72" />
    <!-- The theme has to be on the document before the first paint. app.js is a module, so it runs
         after the board has already been drawn once, and a saved theme applied there arrives as a
         visible flash of the other one. -->
    <script>
      try {
        var saved = localStorage.getItem("nyc-ferry-did-theme");
        var known = ["night", "hello-kitty", "cinnamoroll", "pompompurin", "kuromi", "windows-xp", "hacker"];
        document.documentElement.dataset.theme = known.indexOf(saved) === -1 ? "nyc-ferry" : saved;
      } catch (error) {
        document.documentElement.dataset.theme = "nyc-ferry";
      }
      // Which board this is. The signage display is served at the site root and the public board
      // under /ferryTimesMobile/ — the same split the service worker uses to find its document.
      // The kiosk is drawn for one fixed 16:9 screen and must keep all of it, so the roomy layout
      // and the docked landing rail are both for the app only. Set here rather than in app.js for
      // the same reason as the theme: the module runs after the first paint, and a board that
      // reflows once it loads is worse than one that never moved.
      document.documentElement.dataset.surface =
        new URL("./", location).pathname === "/" ? "kiosk" : "app";
    </script>
  </head>
  <body>
    <main class="screen" id="screen">
      <div class="content">
        <section class="board" aria-labelledby="landingName">
          <div class="board-heading">
            <button type="button" class="menu-button" id="menuButton" aria-expanded="false" aria-controls="landingMenu">
              <span class="menu-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Choose landing</span>
            </button>
            <h1 id="landingName">NYC Ferry</h1>
            <button type="button" class="nearest-button" id="nearestButton" data-state="idle">
              <svg class="nearest-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 1v3m0 16v3M1 12h3m16 0h3" />
              </svg>
              <span class="nearest-label" id="nearestLabel">Nearest</span>
            </button>
            <div class="board-state">
              <div class="route-count" id="routeCount">Loading routes…</div>
              <div class="status" id="dataStatus"><i></i><span>Local schedule</span></div>
              <div class="clock"><time id="clockTime">--:--</time><span id="clockDate">Loading schedule…</span></div>
            </div>
          </div>
          <div class="column-head" id="columnHead" hidden><span>Route</span><span>Direction</span><span>Next departures</span></div>
          <!-- Sits outside the departures list rather than as its first row: the list scrolls and
               the kiosk view sizes its rows to a fixed height, and this belongs to the board rather
               than to any sailing on it. -->
          <p class="board-note" id="boardNote" hidden></p>
          <div class="departures" id="departures" aria-live="polite"></div>
          <!-- Below the list, not above it: the question "what about tomorrow?" is the one you have
               after you have read today's boats and run out of them. The clock format sits beside
               it because both are about how the board is read rather than what it says. -->
          <div class="board-footer">
            <button type="button" class="filter-button" id="filterButton" aria-expanded="false" aria-controls="filterMenu" aria-label="Filter operators">
              <svg class="filter-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 5h18l-7 8v6l-4 2v-8Z" />
              </svg>
              <span class="filter-count" id="filterCount" hidden></span>
            </button>
            <!-- Beside the filter because both are the same kind of control: neither changes what the
                 board knows, only how it is read. -->
            <button type="button" class="filter-button theme-button" id="themeButton" aria-expanded="false" aria-controls="themeMenu" aria-label="Theme">
              <svg class="filter-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none" />
              </svg>
            </button>
            <div class="date-bar" id="dateBar" data-state="today">
              <button type="button" class="date-step" id="datePrev" aria-label="Previous day">‹</button>
              <button type="button" class="date-current" id="dateCurrent" aria-label="Showing today's schedule">Today</button>
              <button type="button" class="date-step" id="dateNext" aria-label="Next day">›</button>
            </div>
            <button type="button" class="clock-toggle" id="clockToggle" aria-pressed="false">24 h</button>
          </div>
        </section>
      </div>
      <div class="landing-menu" id="landingMenu" hidden>
        <div class="landing-menu-scrim" id="landingMenuScrim"></div>
        <nav class="landing-menu-panel" id="landingMenuPanel" aria-label="Choose landing">
          <div class="landing-menu-head">
            <strong>Landing</strong>
            <button type="button" class="landing-menu-close" id="landingMenuClose">Done</button>
          </div>
          <div class="sort-toggle" role="group" aria-label="Sort departures">
            <button type="button" class="sort-option" id="sortByRoute" data-sort="route" aria-pressed="false">Route</button>
            <button type="button" class="sort-option" id="sortByTime" data-sort="time" aria-pressed="true">Departure time</button>
          </div>
          <ul class="landing-list" id="landingList"></ul>
        </nav>
      </div>
      <!-- Anchored to the footer rather than the landing drawer: hiding an operator is something you
           do while looking at the board it changes, and the answer has to be visible behind it. -->
      <div class="filter-menu" id="filterMenu" hidden>
        <div class="filter-menu-scrim" id="filterMenuScrim"></div>
        <div class="filter-menu-panel" id="filterMenuPanel" role="dialog" aria-modal="true" aria-label="Filter operators">
          <div class="filter-menu-head">
            <strong>Operators</strong>
            <button type="button" class="filter-menu-close" id="filterMenuClose">Done</button>
          </div>
          <ul class="filter-list" id="filterList"></ul>
          <button type="button" class="filter-reset" id="filterReset">Show all</button>
        </div>
      </div>
      <!-- Same sheet shape and the same option rows as the operator filter: it is opened from the
           button beside it and does the same class of thing, so it should not look like a new idea. -->
      <div class="filter-menu theme-menu" id="themeMenu" hidden>
        <div class="filter-menu-scrim" id="themeMenuScrim"></div>
        <div class="filter-menu-panel" role="dialog" aria-modal="true" aria-label="Theme">
          <div class="filter-menu-head">
            <strong>Theme</strong>
            <button type="button" class="filter-menu-close" id="themeMenuClose">Done</button>
          </div>
          <ul class="filter-list" id="themeList"></ul>
        </div>
      </div>
      <section class="manual-override" id="manualOverride" hidden aria-live="assertive" aria-atomic="true">
        <div class="manual-override-box" id="manualOverrideBox" data-size="short">
          <span class="manual-override-label">Service notice</span>
          <p id="manualOverrideMessage"></p>
          <small id="manualOverrideUpdated"></small>
        </div>
      </section>
      <!-- A button, because the bar can only ever show one alert and there are usually several. It
           stays a live region: the summary still announces itself when the feed changes, and the
           sheet behind it is where the rest of them live. -->
      <button type="button" class="service-alert-bar loading" id="serviceAlerts" aria-live="polite" aria-atomic="true" aria-expanded="false" aria-controls="alertMenu" disabled>
        <svg class="service-alert-icon" width="48" height="48" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path d="M16 3 30 28H2L16 3Z" />
          <path d="M16 11v8m0 4v1" />
        </svg>
        <span class="service-alert-copy">
          <span class="service-alert-heading">
            <strong>Service alerts</strong>
            <small id="serviceAlertFreshness">Realtime GTFS service updates</small>
          </span>
          <span class="service-alert-summary" id="serviceAlertSummary">Checking NYC Ferry service…</span>
        </span>
        <span class="service-alert-count" id="serviceAlertCount" hidden></span>
        <svg class="service-alert-chevron" id="serviceAlertChevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
          <path d="M7 14.5 12 9.5l5 5" />
        </svg>
      </button>
      <!-- The rest of the alerts. Same sheet as the operator filter and the theme picker, for the
           same reason: it is opened from the thing it belongs to and the board stays visible. -->
      <div class="filter-menu alert-menu" id="alertMenu" hidden>
        <div class="filter-menu-scrim" id="alertMenuScrim"></div>
        <div class="filter-menu-panel" role="dialog" aria-modal="true" aria-label="Service alerts">
          <div class="filter-menu-head">
            <strong>Service alerts</strong>
            <button type="button" class="filter-menu-close" id="alertMenuClose">Done</button>
          </div>
          <ul class="filter-list alert-list" id="alertList"></ul>
        </div>
      </div>
    </main>
    <script type="module" src="/app.js?v=72"></script>
  </body>
</html>
