name: FerryKitty
options:
  bundleIdPrefix: nyc.juliet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
packages:
  FerryCore:
    path: FerryCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    FERRY_API_BASE_URL: https://juliet.nyc
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  FerryKitty:
    type: application
    platform: iOS
    sources:
      - path: FerryKitty
      - path: Shared
    dependencies:
      - package: FerryCore
      - target: FerryKittyWidget
        embed: true
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Ferry Kitty
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: Find the nearest ferry landing in the app and your Ferry Kitty widget. Your location stays on this device.
        CFBundleURLTypes:
          - CFBundleURLName: nyc.juliet.ferryboard
            CFBundleURLSchemes: [ferryboard]
        FerryAPIBaseURL: $(FERRY_API_BASE_URL)
        FerryWidgetKeychainGroup: $(AppIdentifierPrefix)nyc.juliet.ferryboard.widgets
        # Settings > Server > Other may name a development server on the local network over http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Ferry RT serves plain http on the internal network; the app reads boarding slips from it.
          NSExceptionDomains:
            nycf-web.dc-west.hornblower.com:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: Reach a Ferry Kitty test server on your network when one is chosen in Settings > Server.
    settings:
      base:
        # Preserve installed app data and the shared widget settings identity.
        PRODUCT_BUNDLE_IDENTIFIER: nyc.juliet.ferryboard
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/WidgetShared.entitlements
  FerryKittyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FerryKittyWidget
      - path: Shared
      - path: FerryKitty/Theme.swift
    dependencies:
      - package: FerryCore
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Ferry Kitty
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSWidgetWantsLocation: true
        FerryAPIBaseURL: $(FERRY_API_BASE_URL)
        FerryWidgetKeychainGroup: $(AppIdentifierPrefix)nyc.juliet.ferryboard.widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nyc.juliet.ferryboard.nearby
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Config/WidgetShared.entitlements
  FerryKittyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FerryKittyTests
      - path: FerryKittyWidget/NearbyWidgetView.swift
      - path: FerryKittyWidget/NearbyProvider.swift
      - path: FerryKittyWidget/WidgetLocation.swift
      - path: FerryKittyWidget/WidgetConfiguration.swift
      - path: FerryKitty/Theme.swift
      - path: Shared/WidgetSettingsBridge.swift
    dependencies:
      - target: FerryKitty
      - package: FerryCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FerryKittyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FerryKittyUITests]
    dependencies:
      - target: FerryKitty
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FerryKitty:
    build:
      targets:
        FerryKitty: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FerryKittyTests
        - FerryKittyUITests
      gatherCoverageData: true
    archive:
      config: Release
